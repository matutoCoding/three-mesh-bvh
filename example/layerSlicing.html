<!DOCTYPE html>
<html>
<head>
    <title>three-mesh-bvh - Layer Slicing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style type="text/css">
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        #info {
            top: 0;
            width: 100%;
            pointer-events: none;
            position: absolute;
            color: white;
            font-family: monospace;
            text-align: center;
            padding: 5px 0;
        }

        #output {
            color: white;
            position: absolute;
            left: 10px;
            bottom: 10px;
            opacity: 0.7;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div id="info">
        Layer-by-layer slicing with capped, hole-aware contours. Drag the layer height and layer index, export the current layer to SVG.
    </div>
    <div id="output"></div>
    <script type="module" src="./layerSlicing.js"></script>
</body>
</html>
